services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "flask --app run:app db upgrade && exec gunicorn --bind=0.0.0.0:5000 --workers=2 --threads=4 --timeout=60 --reload run:app",
      ]
    volumes:
      # Docker Desktop handles this source bind on Windows. Code edits and the
      # existing storage tree stay on the host; no SQLite data is copied.
      - .:/app
    ports:
      - "0.0.0.0:5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
