{% extends 'base.html' %}
{% import 'macros/forms.html' as forms %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" action="{{ url_for('auth.login') }}">
  {{ forms.csrf_field() }}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <p><label>Логин <input type="text" name="login" value="{{ login or '' }}" required autocomplete="username"></label></p>
  <p><label>Пароль <input type="password" name="password" required autocomplete="current-password"></label></p>
  <button type="submit">Войти</button>
</form>
<p><a href="{{ url_for('auth.register') }}">Регистрация</a></p>
{% endblock %}
