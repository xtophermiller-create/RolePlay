{% import 'macros/forms.html' as forms %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RolePlay{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/button.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}">
  <script type="module" src="{{ url_for('static', filename='js/confirm.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}
  <header class="ui-topbar">
    <nav class="ui-topbar__nav" aria-label="Навигация">
      <a class="ui-btn ui-btn--top" href="{{ url_for('home.index') }}">На главную</a>
    </nav>
  </header>
  {% endblock %}
  <main class="{% block main_class %}{% endblock %}">
    {% block notices %}{{ forms.errors_list(errors) }}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <div class="ui-confirm" id="ui-confirm" aria-hidden="true">
    <div class="ui-confirm__backdrop" data-confirm-close></div>
    <div class="ui-confirm__panel" role="dialog" aria-modal="true" aria-labelledby="ui-confirm-title">
      <h2 class="ui-confirm__title" id="ui-confirm-title">Подтвердить?</h2>
      <p class="ui-confirm__text" data-confirm-text hidden></p>
      <div class="ui-confirm__actions">
        <button class="ui-btn ui-btn--danger" type="button" data-confirm-ok>Да</button>
        <button class="ui-btn ui-btn--accent" type="button" data-confirm-close>НЕТ!</button>
      </div>
    </div>
  </div>
</body>
</html>
