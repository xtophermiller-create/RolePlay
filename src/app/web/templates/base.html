{% import 'macros/forms.html' as forms %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RolePlay{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/button.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}
  <header class="ui-topbar">
    <nav class="ui-topbar__nav" aria-label="Навигация">
      <a class="ui-btn ui-btn--top" href="{{ url_for('home.index') }}">На главную</a>
    </nav>
  </header>
  {% endblock %}
  <main class="{% block main_class %}{% endblock %}">
    {% block notices %}{{ forms.errors_list(errors) }}{% endblock %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
